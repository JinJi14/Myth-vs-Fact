<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myth or Fact? — CVD & Stroke Rehab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F6F7;
    --ink: #16232B;
    --ink-soft: #5B6B72;
    --paper: #FFFFFF;
    --line: #DCE4E6;
    --risk: #0E7C7B;
    --cardiac: #1F5DA0;
    --stroke: #6A3D9A;
    --exercise: #D9782D;
    --accent: var(--risk);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:28px 16px 40px;
    overflow-x:hidden;
  }

  /* ---- ECG signature line ---- */
  .ecg-wrap{
    width:100%;
    max-width:720px;
    height:34px;
    margin-bottom:6px;
    opacity:.85;
  }
  .ecg-wrap svg{width:100%;height:100%;overflow:visible;}
  .ecg-path{
    fill:none;
    stroke:var(--accent);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:600;
    stroke-dashoffset:600;
    animation:draw 2.6s ease-in-out infinite;
    transition:stroke .35s ease;
  }
  @keyframes draw{
    0%{stroke-dashoffset:600;}
    55%{stroke-dashoffset:0;}
    100%{stroke-dashoffset:-600;}
  }

  header{
    text-align:center;
    max-width:640px;
    margin-bottom:18px;
  }
  h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:clamp(24px,4vw,34px);
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:15px;
  }

  /* ---- round filter chips ---- */
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin:20px 0 26px;
  }
  .chip{
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--accent);color:var(--ink);}
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* ---- scene / card ---- */
  .scene{
    width:min(92vw,440px);
    height:300px;
    perspective:1600px;
    margin-bottom:22px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:20px;
    background:var(--paper);
    border:2px solid var(--accent);
    box-shadow:0 10px 30px -12px rgba(22,35,43,.25);
    padding:24px 26px;
    display:flex;
    flex-direction:column;
  }
  .face.back{transform:rotateY(180deg);}

  .face-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:14px;
  }
  .face-label .num{
    background:var(--accent);
    color:#fff;
    border-radius:999px;
    padding:2px 10px;
    font-size:11.5px;
  }

  .question-text{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:clamp(18px,3.4vw,21px);
    line-height:1.35;
    flex:1;
    display:flex;
    align-items:center;
  }
  .tap-hint{
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
    font-style:italic;
    margin-top:auto;
    padding-top:10px;
  }

  .answer-badge{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:30px;
    color:var(--accent);
    margin-bottom:10px;
  }
  .explanation{
    font-size:15px;
    line-height:1.5;
    color:var(--ink);
    flex:1;
  }

  /* ---- controls ---- */
  .controls{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:10px;
  }
  button.nav{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }
  button.nav:hover{border-color:var(--accent);color:var(--accent);}
  button.nav:disabled{opacity:.35;cursor:default;}
  button.reveal{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  button.reveal:hover{filter:brightness(1.08);color:#fff;}

  .progress-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-top:4px;
  }
  .progress-text{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .progress-bar{
    width:min(92vw,440px);
    height:5px;
    background:var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
    transition:width .3s ease, background .3s ease;
  }

  .shuffle{
    margin-top:14px;
    font-size:13px;
    color:var(--ink-soft);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .shuffle:hover{color:var(--accent);}

  @media (prefers-reduced-motion: reduce){
    .ecg-path{animation:none;stroke-dashoffset:0;}
    .card{transition:none;}
  }

  /* ---- export controls ---- */
  .export-row{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button.export{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 16px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:all .15s ease;
  }
  button.export:hover{border-color:var(--accent);color:var(--accent);}

  /* ---- printable sheet (hidden on screen, shown when printing) ---- */
  #printSheet{display:none;}

  @media print{
    body > *:not(#printSheet){display:none !important;}
    #printSheet{
      display:block !important;
      padding:0;
      color:#111;
      font-family:'Inter',system-ui,sans-serif;
    }
    #printSheet h1{
      font-family:'Manrope',sans-serif;
      font-size:22px;
      margin:0 0 4px;
    }
    #printSheet .print-sub{
      color:#555;
      font-size:12px;
      margin-bottom:18px;
    }
    #printSheet .print-round-title{
      font-family:'Manrope',sans-serif;
      font-weight:800;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.05em;
      margin:22px 0 8px;
      padding-bottom:4px;
      border-bottom:2px solid #111;
      break-after:avoid;
    }
    #printSheet .print-card{
      break-inside:avoid;
      padding:10px 0;
      border-bottom:1px solid #ddd;
    }
    #printSheet .print-q{
      font-weight:700;
      font-size:13px;
      margin-bottom:4px;
    }
    #printSheet .print-a{
      font-size:12.5px;
      color:#333;
    }
    #printSheet .print-a b{
      text-transform:uppercase;
      margin-right:4px;
    }
  }
</style>
</head>
<body>

  <div class="ecg-wrap">
    <svg viewBox="0 0 600 34" preserveAspectRatio="none">
      <path class="ecg-path" d="M0,17 L150,17 L168,17 L178,4 L190,30 L202,10 L214,17 L232,17 L600,17"/>
    </svg>
  </div>

  <header>
    <h1>Myth or Fact?</h1>
    <p>Cardiovascular disease &amp; stroke, from a rehab physiotherapy perspective</p>
  </header>

  <div class="chips" id="chips"></div>

  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="face-label"><span id="frontRound">—</span><span class="num" id="frontNum">#1</span></div>
        <div class="question-text" id="questionText">Loading…</div>
        <div class="tap-hint">tap the card to reveal the answer</div>
      </div>
      <div class="face back">
        <div class="face-label"><span id="backRound">—</span><span class="num" id="backNum">#1</span></div>
        <div class="answer-badge" id="answerBadge">MYTH</div>
        <div class="explanation" id="explanationText"></div>
        <div class="tap-hint">tap to flip back</div>
      </div>
    </div>
  </div>

  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Card 1 of 28</div>
  </div>

  <div class="controls">
    <button class="nav" id="prevBtn">← Prev</button>
    <button class="nav reveal" id="flipBtn">Flip card</button>
    <button class="nav" id="nextBtn">Next →</button>
  </div>

  <button class="shuffle" id="shuffleBtn">Shuffle deck</button>

  <div class="export-row">
    <button class="export" id="exportPdfBtn">⬇ Export answer key (PDF)</button>
    <button class="export" id="exportCsvBtn">⬇ Export data (CSV)</button>
  </div>

  <div id="printSheet"></div>

<script>
const ROUNDS = {
  risk:     { label: "CVD & Stroke Risk",       color: "#0E7C7B" },
  cardiac:  { label: "Cardiac Rehab Physio",     color: "#1F5DA0" },
  stroke:   { label: "Stroke Rehab Physio",      color: "#6A3D9A" },
  exercise: { label: "Exercise Prescription",    color: "#D9782D" },
};

const CARDS = [
  {r:"risk", q:"High blood pressure & high cholesterol usually cause noticeable symptoms.", a:"MYTH", e:"Both are usually silent — most people find out via screening, not symptoms."},
  {r:"risk", q:"If you feel fine, it's safe to ignore your cardiovascular risk factors.", a:"MYTH", e:"Risk factors build silently for years before symptoms appear."},
  {r:"risk", q:"Family history is the only thing that determines heart disease/stroke risk.", a:"MYTH", e:"Genetics matter, but most risk comes from modifiable lifestyle factors."},
  {r:"risk", q:"Stroke and heart disease share many of the same underlying risk factors.", a:"FACT", e:"High blood pressure, cholesterol, diabetes, smoking & inactivity raise both risks."},
  {r:"risk", q:"Cardiac rehab is only for people who've had a major heart attack.", a:"MYTH", e:"It also benefits people after surgery/procedures or managing ongoing conditions like angina."},
  {r:"risk", q:"You can be too old to benefit from cardiac or stroke rehabilitation.", a:"MYTH", e:"Programs are tailored; older adults often make meaningful gains in strength and mobility."},
  {r:"risk", q:"Cardiac rehab only focuses on physical recovery, not emotional health.", a:"MYTH", e:"Programs typically address the psychological impact of a cardiac event too."},

  {r:"cardiac", q:"You should rest completely as long as possible after a heart attack.", a:"MYTH", e:"Prolonged rest causes deconditioning; gradual, guided activity is safer and more effective."},
  {r:"cardiac", q:"Exercise is unsafe for people living with heart failure.", a:"MYTH", e:"Much of the breathlessness in mild–moderate heart failure comes from deconditioning itself."},
  {r:"cardiac", q:"A structured, supervised exercise program is core to cardiac rehab.", a:"FACT", e:"Programs are individualized and closely monitored to ensure the heart copes well with the load."},
  {r:"cardiac", q:"Completing cardiac rehab lowers risk of dying from a future cardiac event.", a:"FACT", e:"Linked to meaningfully lower risk of death, hospital readmission & repeat cardiac events."},
  {r:"cardiac", q:"Lifting weights is off-limits during cardiac rehab.", a:"MYTH", e:"Appropriately introduced, supervised resistance training is part of many cardiac rehab programs."},
  {r:"cardiac", q:"Patients should hold their breath while lifting weights in cardiac rehab.", a:"MYTH", e:"Holding your breath spikes blood pressure suddenly — steady breathing is taught instead."},
  {r:"cardiac", q:"Cardiac rehab is something most people attend for the rest of their lives.", a:"MYTH", e:"It's typically a structured, time-limited program (~3 months), then independent activity."},

  {r:"stroke", q:"Once a stroke survivor plateaus in therapy, further improvement is impossible.", a:"MYTH", e:"Recovery is a long-term process — meaningful gains can continue well beyond initial rehab."},
  {r:"stroke", q:"Physiotherapy after stroke focuses only on walking, not arms or hands.", a:"MYTH", e:"Upper limb weakness affects nearly half of survivors; arm and hand rehab matters too."},
  {r:"stroke", q:"Starting rehab exercise within a day or two of stroke can aid recovery.", a:"FACT", e:"Early, appropriately dosed rehab exercise may support neurological recovery."},
  {r:"stroke", q:"Repetitive, task-specific practice helps rebuild function after stroke.", a:"FACT", e:"Repeated practice of real-world tasks is a core physiotherapy principle for recovery."},
  {r:"stroke", q:"Cardiorespiratory (aerobic) fitness is often reduced after a stroke.", a:"FACT", e:"Lower fitness is common post-stroke, making everyday tasks like carrying groceries harder."},
  {r:"stroke", q:"Aerobic exercise after stroke can help lower the risk of a second stroke.", a:"FACT", e:"Linked to reduced risk of cardiovascular disease recurrence and death, plus fitness gains."},
  {r:"stroke", q:"Balance training is a minor concern in stroke rehabilitation.", a:"MYTH", e:"Impaired balance is closely tied to fall risk and a common focus of stroke rehab."},
  {r:"stroke", q:"Access to stroke rehab typically stays the same for as long as needed.", a:"MYTH", e:"Publicly funded access often drops sharply after around six months post-stroke."},

  {r:"exercise", q:"Stretching before exercise is the best way to prevent injury in rehab.", a:"MYTH", e:"Static stretching doesn't reliably prevent injury — a proper warm-up matters more."},
  {r:"exercise", q:"Dynamic warm-ups before exercise, static stretches after, is preferred.", a:"FACT", e:"Dynamic movement primes the body; static stretching afterward suits warm, pliable muscles."},
  {r:"exercise", q:"Resistance training offers cardiovascular benefits, not just muscle ones.", a:"FACT", e:"Can improve blood pressure, blood sugar regulation & cholesterol, alongside strength."},
  {r:"exercise", q:"Light daily activity offers no real cardiovascular benefit vs exercise.", a:"MYTH", e:"Light daily activity is linked to meaningfully lower risk of cardiovascular events."},
  {r:"exercise", q:"Rehab exercise programs are the same for every cardiovascular/stroke patient.", a:"MYTH", e:"Physios tailor programs to each person's impairments, fitness level, and goals."},
  {r:"exercise", q:"Continuing activity after rehab ends helps maintain the gains made.", a:"FACT", e:"Long-term outcomes depend heavily on sustained activity after formal rehab ends."},
];

// assign sequential numbers based on original order (stable, for facilitator reference)
CARDS.forEach((c,i)=> c.num = i+1);

let order = CARDS.map((_,i)=>i);
let filterKey = "all";
let pos = 0;
let flipped = false;

const cardEl = document.getElementById('card');
const frontRound = document.getElementById('frontRound');
const backRound = document.getElementById('backRound');
const frontNum = document.getElementById('frontNum');
const backNum = document.getElementById('backNum');
const questionText = document.getElementById('questionText');
const answerBadge = document.getElementById('answerBadge');
const explanationText = document.getElementById('explanationText');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const flipBtn = document.getElementById('flipBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const chipsWrap = document.getElementById('chips');
const ecgPath = document.querySelector('.ecg-path');

function currentIndices(){
  if(filterKey === "all") return order;
  return order.filter(i => CARDS[i].r === filterKey);
}

function setAccent(color){
  document.documentElement.style.setProperty('--accent', color);
}

function render(){
  const indices = currentIndices();
  if(pos >= indices.length) pos = 0;
  if(pos < 0) pos = indices.length - 1;
  const idx = indices[pos];
  const c = CARDS[idx];
  const roundInfo = ROUNDS[c.r];

  setAccent(roundInfo.color);
  frontRound.textContent = roundInfo.label;
  backRound.textContent = roundInfo.label;
  frontNum.textContent = "#" + c.num;
  backNum.textContent = "#" + c.num;
  questionText.textContent = c.q;
  answerBadge.textContent = c.a;
  explanationText.textContent = c.e;

  progressText.textContent = `Card ${pos+1} of ${indices.length}`;
  progressFill.style.width = `${((pos+1)/indices.length)*100}%`;

  prevBtn.disabled = indices.length <= 1;
  nextBtn.disabled = indices.length <= 1;

  flipped = false;
  cardEl.classList.remove('flipped');
}

function flip(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function next(){
  const indices = currentIndices();
  pos = (pos+1) % indices.length;
  render();
}
function prev(){
  const indices = currentIndices();
  pos = (pos-1+indices.length) % indices.length;
  render();
}

function shuffle(){
  for(let i = order.length -1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  render();
}

cardEl.addEventListener('click', flip);
flipBtn.addEventListener('click', flip);
nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);
shuffleBtn.addEventListener('click', shuffle);

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function csvEscape(v){
  const s = String(v).replace(/"/g,'""');
  return `"${s}"`;
}

function exportCsv(){
  const header = ['Number','Round','Question','Answer','Explanation'];
  const rows = CARDS.map(c => [c.num, ROUNDS[c.r].label, c.q, c.a, c.e].map(csvEscape).join(','));
  const csv = [header.join(','), ...rows].join('\n');
  downloadBlob(csv, 'cvd_stroke_myth_fact_data.csv', 'text/csv');
}

function buildPrintSheet(){
  const sheet = document.getElementById('printSheet');
  let html = `<h1>Myth or Fact? — CVD & Stroke Rehab</h1>
    <div class="print-sub">Cardiovascular disease &amp; stroke, from a rehab physiotherapy perspective — facilitator answer key</div>`;
  Object.entries(ROUNDS).forEach(([key, info])=>{
    const items = CARDS.filter(c => c.r === key);
    if(!items.length) return;
    html += `<div class="print-round-title">${info.label}</div>`;
    items.forEach(c=>{
      html += `<div class="print-card">
        <div class="print-q">#${c.num} — ${c.q}</div>
        <div class="print-a"><b>${c.a}</b>${c.e}</div>
      </div>`;
    });
  });
  sheet.innerHTML = html;
}

function exportPdf(){
  buildPrintSheet();
  window.print();
}

document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
document.getElementById('exportPdfBtn').addEventListener('click', exportPdf);

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') next();
  else if(e.key === 'ArrowLeft') prev();
  else if(e.key === ' '){ e.preventDefault(); flip(); }
});

// build round filter chips
const chipDefs = [{key:"all", label:"All rounds", color:"#16232B"}, ...Object.entries(ROUNDS).map(([k,v])=>({key:k,label:v.label,color:v.color}))];
chipDefs.forEach(cd=>{
  const btn = document.createElement('button');
  btn.className = 'chip' + (cd.key==='all' ? ' active' : '');
  btn.textContent = cd.label;
  btn.addEventListener('click', ()=>{
    filterKey = cd.key;
    pos = 0;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
  chipsWrap.appendChild(btn);
});

render();
</script>
</body>
</html>
